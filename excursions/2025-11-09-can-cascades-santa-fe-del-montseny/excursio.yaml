resum: Bonic recorregut curt per un bosc de fulla caduca amb vistes panoràmiques i zona de pícnic a Santa Fe.

descripcio: |
  Durant la Tardor, és especialment bonic caminar pel mig d’un bosc de fulla caduca, amb els colors groguencs que adquireixen els faigs en aquesta estació. Aquest és el principal atractiu d’aquest bonic i curt recorregut que, a més, té molt bones vistes en alguns punts. El recorregut transcorre per pista no asfaltada, sense cap mena de risc. S'inclou una zona de pícnic a Santa Fe on es pot dinar de carmanyola i jugar els nens si el temps ho permet. Al final del recorregut es pot visitar el Centre d’Interpretació de can Cascades per veure un audiovisual sobre el Parc Natural.

