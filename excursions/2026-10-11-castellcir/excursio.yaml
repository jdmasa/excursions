resum: Castell medieval en runes damunt d'una mola rocosa, entre camps de cereals i boscos d'alzines, roures i pins.

descripcio: |
  El castell de Castellcir (conegut com a Castell de la Popa per la mola rocosa sobre la qual reposa) és una construcció medieval imponent, tot i que ara està en runes.

  S'hi arriba seguint l'antiga pista del castell, a través de camps de cereals i boscos d'alzines, roures i pins. La tornada es fa pel Pla de la Bruga i el Serrat del Colom, des d'on hi ha unes bones vistes del castell.

