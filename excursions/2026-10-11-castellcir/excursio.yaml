notes:
  Al arribar a la bifurcació, vam trobar un cartell que indicava que el camí cap al castell estava tancat per obres. Vam haver de fer servir el mateix camí per pujar i baixar del castell, cosa que va fer que l'excursió fos més llarga del previst. Tot i això, vam gaudir de les vistes i de la natura al llarg del recorregut.