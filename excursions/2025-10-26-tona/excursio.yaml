descripcio: |
  Es tracta d'un bonic passeig circular pels voltants de Tona. La ruta inclou una forta baixada des del Castell, per la qual cosa és recomanable anar ben calçat. Des del castell es gaudeix d'una molt bona vista sobre tota la comarca. El castell està ben conservat, especialment el mantell vegetal, ja que no es permet la pujada en cotxe.

  El lloc és ideal per dinar i oferix un bon espai perquè els nens i nenes puguin jugar.

