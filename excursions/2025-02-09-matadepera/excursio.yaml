resum: Excursió per un antic camí ral cap al Monestir de Sant Llorenç, amb visita breu al monestir i parada per esmorzar.

descripcio: |
  L'excursió comença al dipòsit d'aigües de Matadepera i segueix el camí ral o camí dels monjos cap al Monestir de Sant Llorenç. El camí és en pujada i empedrat en alguns trams. El monestir, tot i estar sense ús, es troba en bon estat i és de gran bellesa, custodiat pels agents rurals del Parc Natural. Anteriorment hi havia un restaurant, però va tancar fa un any.

