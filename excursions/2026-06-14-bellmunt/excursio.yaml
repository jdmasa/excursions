descripcio: |
  Excursió d'anada i tornada des del Coll de Vidrà fins al Santuari de Bellmunt, passant pel Collet del Llop i el Coll de Migdia, seguint el GR 3. La tornada es fa pel mateix camí.

  Vam dinar de pícnic (carmanyola), ja que es va descartar el restaurant del santuari per dificultats de reserva.

  El track del mapa és una reconstrucció feta a partir dels punts de pas, seguint els camins d'OpenStreetMap; no és l'enregistrament GPS de la sortida.

