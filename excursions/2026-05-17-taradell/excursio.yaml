resum: Caminada fàcil i plana per indrets de gran bellesa, visitant les Cuines d'en Rocaguinarda i el Castell de can Boix.

descripcio: |
  La caminada transcorre per indrets de gran bellesa, passant per les Cuines d’en Rocaguinarda, un lloc amb llegenda sobre un bandoler del segle XVII que s’hi amagava. S'arribarà al castell de Boix, també conegut com a Castell de Taradell, des d'on es gaudirà de panoràmiques de la zona. Després de visitar el castell, es tornarà al punt de sortida per un corriol.

