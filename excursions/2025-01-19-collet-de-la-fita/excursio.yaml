descripcio: |
  L'excursió transcorre per la muntanya del Garraf, amb un itinerari fàcil apte per a totes les edats. Es recomana portar bon calçat per caminar per la muntanya i motxilla, evitant bosses penjant. La ruta inclou una parada per esmorzar.

  El track del mapa és una reconstrucció feta a partir dels punts de pas, seguint els camins d'OpenStreetMap; no és l'enregistrament GPS de la sortida.

