  L'excursió comença a Sant Pere de Valldeneu i ascendeix a la Trona, seguint un sender enmig del bosc. Després, es fa una passejada panoràmica pel cantó del Cingle fins al Mirador de Can Tresquarts, baixant en pista fins a Can Oller i tornant a Sant Pere de Valldeneu.

