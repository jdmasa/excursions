resum: Excursió per la collada de Bracons amb vistes esplèndides i opció de pujar al puig dels llops.

descripcio: |
  L'excursió comença endinsant-se en una zona ombrívola de boscos frondosos (faig, grèvol) que forma part del vessant est de la Serra de Curull. En arribar a la collada de Sant Bartomeu, passem a vessant de Vidrà de la mateixa serra, i continuem planejant fins a la font Tornadissa. Allà comencem a pujar fins als Rasos de Manter. El paisatge llavors canvia a prats subalpins fins a la pujada forta però curta just abans d’arribar al cim, on ens esperen unes vistes esplèndides. Hi ha l'opció d'arribar fins puig dels llops (+ 2 km aprox.).

